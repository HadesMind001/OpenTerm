version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]

  # pip support reads backend/pyproject.toml (PEP 621 project table)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/bot-runtime"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/bot-protocol"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
