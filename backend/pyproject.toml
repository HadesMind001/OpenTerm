[project]
name = "openterm"
version = "0.1.0"
description = "Local, self-hosted market terminal: realtime data, charts, paper trading, alerts, screening"
# NOTE: no `readme` field — the README lives at the repo root, outside this
# package dir, and PEP 621 forbids escaping with ../ (hatchling would refuse it).
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Franz Mayer" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=14",          # NOTE: >=14 renamed connect(extra_headers=) -> additional_headers=;
                              # providers/oanda.py uses the new spelling and will NOT work on 13.x.
    "pydantic>=2.7",
    "msgpack>=1.0",            # WS binary frame payloads (see api/ws_codec.py)
    "zstandard>=0.22",         # WS compression of large event frames (see api/ws_codec.py)
    "numpy>=1.26",             # NOT imported by the app (correlation is plain-python in routes); kept for the scripts console's venv imports — trim if that ever matters
    "scipy>=1.11",             # options greeks (services/options.py)
]

[project.scripts]
openterm = "openterm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
# The repo-root README lives outside backend/; without this hatchling would
# fail to include it and the editable install would die confusingly.
packages = ["openterm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
